<div class="d-flex flex-wrap talents-list">
  <template data-source="talents/talents.data.json" data-sortedby="name" data-filteredbykey="tier"
            data-filteredbyvalue="3">
    <div>
      <h5>${{ name }}</h5>
      <p>
        <b>Tier:&nbsp;</b>${{ tier }}<br>
        <b>Activation:&nbsp;</b>${{ act }}<br>
        <b>Ranked:&nbsp;</b>${{ ranked }}<br data-disableonnullkey="prereq">
        <i data-disableonnullkey="prereq"><b>Prerequisites:&nbsp;</b>${{ prereq }}</i>
      </p>
      <p>${{ desc }}</p>
    </div>
  </template>
</div>
