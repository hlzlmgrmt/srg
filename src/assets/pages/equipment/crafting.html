<p>crafting works!</p>
<div class="table-responsive">
  <table class="table table-hover">
    <caption>Ranged Weapon Templates</caption>
    <thead>
    <tr>
      <th>Name</th>
      <th>Pr.</th>
      <th>Rar.</th>
      <th>Check</th>
      <th>Time</th>
      <th>Examples</th>
    </tr>
    </thead>
    <tbody>
    <template data-source="equipment/crafting/crafting_templates.data.json" data-filterbykey="cat"
              data-filterbyvalue="ranged">
      <tr>
        <th>${{ name }}</th>
        <td>&yen;&nbsp;${{ pr }}</td>
        <td>${{ rar }}</td>
        <td>${{ check }}</td>
        <td>${{ time }}</td>
        <td><span data-hideonnullvalueforkey="examples">${{ examples }}</span></td>
      </tr>
    </template>
    </tbody>
  </table>
</div>

<div class="table-responsive">
  <table class="table table-hover">
    <caption>Ranged Weapon Template Profiles</caption>
    <thead>
    <tr>
      <th>Name</th>
      <th>Skill</th>
      <th>Dam.</th>
      <th>Crit</th>
      <th>Range</th>
      <th>Enc.</th>
      <th>HP</th>
      <th>Special</th>
    </tr>
    </thead>
    <tbody>
    <template data-source="equipment/crafting/crafting_templates.data.json" data-filterbykey="cat"
              data-filterbyvalue="ranged">
      <tr>
        <th>${{ name }}</th>
        <td>${{ skill }}</td>
        <td>${{ dam }}</td>
        <td>${{ crit }}</td>
        <td>${{ range }}</td>
        <td>${{ enc }}</td>
        <td>${{ hp }}</td>
        <td>${{ special }}</td>
      </tr>
    </template>
    </tbody>
  </table>
</div>
