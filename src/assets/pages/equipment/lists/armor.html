<p>armor works!</p>
<div class="table-responsive">
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Name</th>
      <th>Soak</th>
      <th>Def.</th>
      <th>Enc.</th>
      <th>HP</th>
      <th>Pr.</th>
      <th>Rar.</th>
      <th>Special</th>
    </tr>
    </thead>
    <tbody>
    <template data-source="equipment/lists/armor/armor.data.json">
      <tr>
        <th>${{ name }}</th>
        <td>${{ soak }}</td>
        <td>${{ def }}</td>
        <td>${{ enc }}</td>
        <td>${{ hp }}</td>
        <td>&yen;&nbsp;${{ pr }}</td>
        <td>${{ rar }}</td>
        <td><span data-hideonnullvalueforkey="special">${{ special }}</span></td>
      </tr>
    </template>
    </tbody>
  </table>
</div>
<template data-source="equipment/lists/armor/armor.data.json">
  <h5 id="equipment/lists/armor/${{key}}">${{ name }}</h5>
  <p data-delimiter="</p><p>">${{ desc }}</p>
</template>

<ins id="equipment/lists/armor/armor_attachments.html">Armor Attachments</ins>
