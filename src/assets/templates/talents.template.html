<div class="d-flex flex-wrap talents-list">
  <template>
    <div>
      <h5 id="talents/${{key}}">${{ name }}</h5>
      <p>
        <b>Tier:&nbsp;</b>${{ tier }}<br>
        <b>Activation:&nbsp;</b>${{ act }}<br data-hideonnullvalueforkey="ranked">
        <span data-hideonnullvalueforkey="ranked"><b>Ranked:&nbsp;</b>${{ ranked }}</span><br data-hideonnullvalueforkey="prereq">
        <i data-hideonnullvalueforkey="prereq"><b>Prerequisites:&nbsp;</b>${{ prereq }}</i>
      </p>
      <p>${{ desc }}</p>
    </div>
  </template>
</div>
