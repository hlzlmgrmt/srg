<div class="table-responsive">
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Name</th>
      <th>Dam.</th>
      <th>Crit.</th>
      <th>Range</th>
      <th>Enc.</th>
      <th>HP</th>
      <th>Pr.</th>
      <th>Rar.</th>
      <th>Special</th>
    </tr>
    </thead>
    <tbody>
    <template>
      <tr>
        <th>${{ name }}</th>
        <td>${{ damage }}</td>
        <td>${{ crit }}</td>
        <td>${{ range }}</td>
        <td>${{ enc }}</td>
        <td>${{ hp }}</td>
        <td>&yen;&nbsp;${{ pr }}</td>
        <td>${{ rar }}</td>
        <td><span data-hideonnullvalueforkey="special">${{ special }}</span></td>
      </tr>
    </template>
    </tbody>
  </table>
</div>
<template>
  <h5 id="equipment/lists/weapons/${{key}}">${{ name }}</h5>
  <p data-delimiter="</p><p>">${{ desc }}</p>
  <p data-hideonnullvalueforkey="models" data-delimiter=",&nbsp;"><b>Models Include:&nbsp;</b><i>${{ models }}</i></p>
</template>
